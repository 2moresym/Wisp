[package]
name = "wisp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight Drosophila-inspired neural emulator and hardware-accelerated 3D arena"
license = "MIT"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rayon = "1.10"
wgpu = "0.20"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"

[profile.release.package."*"]
opt-level = 3
